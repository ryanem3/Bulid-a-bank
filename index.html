<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank App</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>

<body>
  <div id="app">Loading...</div>

  <!-- LOGIN AND REGISTRATION PAGE -->
  <template id="login">
    <main class="container">
      <h1>Bank App</h1>
      <div class="card">

        <h2>Login</h2>
        <form id="loginForm" action="javascript:login()">
          <label for="username">Username</label>
          <input id="username" name="user"
                 type="text" required>

          <div id="loginError" role="alert"></div>
          <button type="submit">Login</button>
        </form>

        <hr>

        <h2>Register</h2>
        <form id="registerForm"
              action="javascript:register()">

          <label for="user">Username (required)</label>
          <input id="user" name="user" type="text"
                 maxlength="20" required>

          <label for="currency">Currency (required)</label>
          <input id="currency" name="currency"
                 type="text" value="$"
                 maxlength="5" required>

          <label for="registerDescription">Description</label>
          <input id="registerDescription"
                 name="description" type="text"
                 maxlength="100">

          <label for="registerBalance">Current balance</label>
          <input id="registerBalance" name="balance"
                 type="number" step="0.01" value="0">

          <div id="registerError" role="alert"></div>
          <button type="submit">Register</button>
        </form>

        <p class="footer-link">
          <a href="/credits"
             onclick="onLinkClick(event)">Credits</a>
        </p>
      </div>
    </main>
  </template>

  <!-- DASHBOARD PAGE -->
  <template id="dashboard">
    <main class="container">
      <header class="dashboard-header">
        <h1>Bank App</h1>
        <a href="/login"
           onclick="onLogoutClick(event)">Logout</a>
      </header>

      <section class="balance-card">
        <p>Current Balance</p>
        <h2>
          <span id="balance"></span>
          <span id="currency"></span>
        </h2>
      </section>

      <section class="card">
        <h2 id="description"></h2>
        <h3>Transactions</h3>

        <table>
          <thead>
            <tr>
              <th>Date</th>
              <th>Object</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody id="transactions"></tbody>
        </table>
      </section>
    </main>
  </template>

  <!-- TRANSACTION ROW TEMPLATE -->
  <template id="transaction">
    <tr>
      <td></td>
      <td></td>
      <td></td>
    </tr>
  </template>

  <!-- CREDITS PAGE -->
  <template id="credits">
    <main class="container">
      <div class="card">
        <h1>Bank App Credits</h1>
        <p>JavaScript Banking App Project</p>
        <p>Created by Emily Ryan</p>
        <a href="/login"
           onclick="onLinkClick(event)">
          Back to Login
        </a>
      </div>
    </main>
  </template>

</body>
</html>
